    properties:
      - name: "开度"
        unit: "%"
        display_format: "%.1f"
        color: "red"
      - name: "流量"
        unit: "m³/s"
        display_format: "%.2f"
      - name: "状态"
        display_format: "%s"
    control_modes:
      - "manual"
      - "automatic"
      - "scheduled"
    visualization_templates:
      - "gate_operation"
      - "discharge_curve"
      
  pump:
    display_name: "泵"
    symbol:
      type: "pump"
      color: "#FF69B4"
      border_color: "#C71585"
      border_width: 3.0
      size: [25, 25]
    properties:
      - name: "转速"
        unit: "%"
        display_format: "%.1f"
        color: "red"
      - name: "流量"
        unit: "m³/s"
        display_format: "%.2f"
      - name: "扬程"
        unit: "m"
        display_format: "%.1f"
      - name: "效率"
        unit: "%"
        display_format: "%.1f"
    control_modes:
      - "manual"
      - "automatic"
      - "optimization"
    visualization_templates:
