# 水系统对象标准化展示模板配置
# 基于用户偏好记忆设计，支持配置驱动的系统建模

# 全局显示规范
global_display_settings:
  # 字体显示规范 - 用户偏好记忆要求
  font_settings:
    legend_font_scale: 2.0          # 图例字体放大2倍
    chinese_font_scale: 3.0         # 汉字字体放大3倍（从1像素变为3像素）
    number_font_scale: 2.0          # 数字字体翻倍
    number_color: "red"             # 数字用红色突出显示
    chinese_color: "black"          # 汉字用黑色普通显示
  
  # 图形显示规范
  graphic_settings:
    symbol_border_width: 3.0        # 图例符号边框线条加粗至3.0
    symbol_color_enhancement: true   # 图例符号颜色加深
    node_label_offset: "radius + 0.8"  # 节点标签偏移距离为节点半径+0.8单位
    edge_label_offset: 0.3          # 边标签垂直于线条方向偏移0.3单位
    water_level_offset: "radius + 0.5"  # 水位数字置于节点下方，偏移距离为节点半径+0.5单位
    text_background: true           # 所有文字添加适当的背景框
    text_alignment: "top"           # 水位数字采用顶部对齐
  
  # 多重拓扑图展示方式
  topology_modes:
    - "simple_flowchart"    # 简洁流程图
    - "flow_diagram"        # 流向示意图  
    - "table_mode"          # 表格模式
    - "graphic_mode"        # 图形化模式
    auto_selection: true    # 根据数据特点智能选择最佳展示方式

# 输水对象展示模板
conveyance_objects:
  channel:
    display_name: "河道/渠道"
    symbol:
      type: "channel"
      color: "#4A90E2"
      border_color: "#2E5A8A" 
      border_width: 3.0
      size: [40, 20]
    properties:
      - name: "长度"
        unit: "m"
        display_format: "%.1f"
      - name: "设计流量"
        unit: "m³/s"
        display_format: "%.2f"
      - name: "水位"
        unit: "m"
        display_format: "%.2f"
        color: "red"
        position: "below_node"
        offset: "radius + 0.5"
    visualization_templates:
      - "longitudinal_profile"
      - "flow_time_series"
      - "water_surface_profile"
    
  pipe:
    display_name: "管道"
    symbol:
      type: "pipe"
      color: "#7B68EE"
      border_color: "#4B0082"
      border_width: 3.0
      size: [35, 15]
    properties:
      - name: "长度"
        unit: "m"
        display_format: "%.1f"
      - name: "直径"
        unit: "m"
        display_format: "%.2f"
      - name: "压力"
        unit: "m"
        display_format: "%.2f"
        color: "red"
        position: "below_node"
    visualization_templates:
      - "pressure_line"
      - "pressure_time_series"
      - "flow_time_series"
      
  siphon:
    display_name: "倒虹吸"
    symbol:
      type: "siphon"
      color: "#FF6B35"
      border_color: "#CC3300"
      border_width: 3.0
      size: [30, 25]
    properties:
      - name: "长度"
        unit: "m"
        display_format: "%.1f"
      - name: "流量"
        unit: "m³/s"
        display_format: "%.2f"
        color: "red"
    visualization_templates:
      - "siphon_profile"
      - "flow_time_series"

# 存储对象展示模板  
storage_objects:
  reservoir:
    display_name: "水库"
    symbol:
      type: "reservoir"
      color: "#1E90FF"
      border_color: "#0066CC"
      border_width: 3.0
      size: [50, 35]
    properties:
      - name: "库容"
        unit: "万m³"
        display_format: "%.1f"
      - name: "水位"
        unit: "m"
        display_format: "%.2f"
        color: "red"
        position: "below_node"
        offset: "radius + 0.5"
        alignment: "top"
      - name: "入流"
        unit: "m³/s"
        display_format: "%.2f"
      - name: "出流"
        unit: "m³/s"
        display_format: "%.2f"
    visualization_templates:
      - "reservoir_operation"
      - "water_balance"
      - "capacity_curve"
      
  lake:
    display_name: "湖泊"
    symbol:
      type: "lake"
      color: "#00CED1"
      border_color: "#008B8B"
      border_width: 3.0
      size: [45, 30]
    properties:
      - name: "面积"
        unit: "km²"
        display_format: "%.2f"
      - name: "水位"
        unit: "m"
        display_format: "%.2f"
        color: "red"
        position: "below_node"
    visualization_templates:
      - "lake_level"
      - "water_quality"
      
  storage_tank:
    display_name: "调蓄池"
    symbol:
      type: "tank"
      color: "#32CD32"
      border_color: "#228B22"
      border_width: 3.0
      size: [30, 30]
    properties:
      - name: "容量"
        unit: "m³"
        display_format: "%.0f"
      - name: "水位"
        unit: "m"
        display_format: "%.2f"
        color: "red"
        position: "below_node"
    visualization_templates:
      - "tank_operation"
      - "volume_time_series"

# 调控对象展示模板
