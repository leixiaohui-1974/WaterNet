# 拓扑图展示配置
topology_display:
  # 智能选择规则
  auto_selection_rules:
    - condition: "node_count <= 5"
      recommended_mode: "simple_flowchart"
    - condition: "node_count <= 15"
      recommended_mode: "flow_diagram"
    - condition: "node_count <= 50"
      recommended_mode: "graphic_mode"
    - condition: "node_count > 50"
      recommended_mode: "table_mode"
  
  # 简洁流程图模式
  simple_flowchart:
    node_spacing: 100
    level_spacing: 80
    show_labels: true
    show_properties: false
    line_style: "solid"
    arrow_style: "simple"
    
  # 流向示意图模式
  flow_diagram:
    node_spacing: 120
    level_spacing: 100
    show_labels: true
    show_properties: true
    show_flow_direction: true
    line_style: "solid"
    arrow_style: "detailed"
    flow_animation: true
    
  # 表格模式
  table_mode:
    columns:
      - "对象ID"
      - "类型"
      - "状态"
      - "主要参数"
    sortable: true
    filterable: true
    export_format: ["csv", "excel"]
    
  # 图形化模式
  graphic_mode:
    layout_algorithm: "hierarchical"
    node_spacing: 80
    show_all_properties: true
    interactive: true
    zoom_enabled: true
    pan_enabled: true

# 可视化模板定义
visualization_templates:
  longitudinal_profile:
    title: "纵剖面图"
    x_label: "距离 (m)"
    y_label: "高程 (m)"
    series:
      - name: "底高程"
        color: "brown"
        line_style: "solid"
      - name: "水面线"
        color: "blue"
        line_style: "solid"
    grid: true
    legend: true
    
  pressure_line:
    title: "压力线图"
    x_label: "距离 (m)"
    y_label: "压力水头 (m)"
    series:
      - name: "管底高程"
        color: "black"
        line_style: "solid"
      - name: "压力线"
        color: "red"
        line_style: "solid"
    grid: true
    legend: true
    
  reservoir_operation:
    title: "水库运行图"
    x_label: "时间"
    y_label: "水位/流量"
    series:
      - name: "水位"
        color: "blue"
        y_axis: "left"
      - name: "入流"
        color: "green"
        y_axis: "right"
      - name: "出流"
        color: "red"
        y_axis: "right"
    dual_y_axis: true
    grid: true
    legend: true

# 配置验证规则
validation_rules:
  required_fields:
    - "display_name"
    - "symbol"
    - "properties"
  
  symbol_requirements:
    - "type"
    - "color"
    - "border_color"
    - "border_width"
    - "size"
  
  property_requirements:
    - "name"
    - "display_format"