      - "efficiency_curve"
      
  valve:
    display_name: "阀"
    symbol:
      type: "valve"
      color: "#9370DB"
      border_color: "#663399"
      border_width: 3.0
      size: [20, 20]
    properties:
      - name: "开度"
        unit: "%"
        display_format: "%.1f"
        color: "red"
      - name: "流量比"
        unit: "%"
        display_format: "%.1f"
      - name: "压降"
        unit: "m"
        display_format: "%.2f"
    control_modes:
      - "manual"
      - "automatic"
