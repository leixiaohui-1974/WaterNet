  turbine:
    display_name: "水轮机"
    symbol:
      type: "turbine"
      color: "#FFD700"
      border_color: "#B8860B"
      border_width: 3.0
      size: [30, 30]
    properties:
      - name: "导叶开度"
        unit: "%"
        display_format: "%.1f"
        color: "red"
      - name: "功率"
        unit: "MW"
        display_format: "%.2f"
      - name: "效率"
        unit: "%"
        display_format: "%.1f"
    control_modes:
      - "manual"
      - "automatic"
      - "optimization"
    visualization_templates:
      - "power_generation"
      - "efficiency_curve"

