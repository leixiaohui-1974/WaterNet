[pytest]
# pytest配置文件
# 用于统一WaterNet项目的测试配置

# 测试发现配置
minversion = 7.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 添加项目根目录到Python路径
pythonpath = .

# 输出配置
addopts = --strict-markers --strict-config --verbose --tb=short --color=yes

# 标记定义
markers =
    slow: 标记测试为慢速测试（通常用于性能和大型集成测试）
    integration: 标记为集成测试
    unit: 标记为单元测试
    deep_channel: 标记为深度通道测试
    performance: 标记为性能测试
    smoke: 标记为冒烟测试（快速基本功能测试）

# 过滤警告
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning